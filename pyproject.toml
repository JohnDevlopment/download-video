[project]
name = "download-video"
version = "1.0a0"
description = "Easily download videos from Youtube."
authors = [
    {name = "JohnDevlopment",email = "50782633+JohnDevlopment@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp (>=2025.5.22,<2026.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "typer (>=0.16.0,<0.17.0)"
]

[tool.poetry.scripts]
download-video = "download_video.app:app"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.4.3"
basedpyright = "^1.29.2"
icecream = "^2.1.4"
ruff = "^0.11.13"
pandas = "^2.3.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
